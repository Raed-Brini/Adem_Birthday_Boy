<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIT Terminal v2026.0 - Birthday Edition</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --text-color: #39ff14; /* Matrix / Hacker Green */
      --accent-color: #58a6ff;
      --prompt-color: #ff7b72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .terminal-container {
      width: 100%;
      max-width: 850px;
      height: 85vh;
      height: 85dvh; /* Dynamic viewport height for mobile devices */
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Window Header Bar */
    .terminal-header {
      background: #161b22;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    .title {
      color: #8b949e;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Output Console */
    .terminal-body {
      padding: 15px;
      flex: 1;
      overflow-y: auto;
      line-height: 1.35;
      font-size: 0.85rem;
      -webkit-overflow-scrolling: touch;
    }

    .line {
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ASCII Auto-scaler Container */
    .ascii-art-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 8px 0;
    }

    .ascii-art {
      font-family: 'Courier New', Courier, monospace;
      white-space: pre;
      line-height: 1.1;
      font-size: 0.85rem;
      display: inline-block;
      transform-origin: top left;
    }

    .prompt-symbol {
      color: var(--prompt-color);
      white-space: nowrap;
    }

    .accent {
      color: var(--accent-color);
    }

    /* Interactive Input Line */
    .input-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    input[type="text"] {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-family: inherit;
      font-size: 16px; /* Prevents auto-zoom on iOS */
      flex: 1;
      width: 100%;
    }

    /* Mobile Breakpoints */
    @media (max-width: 600px) {
      body {
        padding: 5px;
      }
      .terminal-container {
        height: 92dvh;
      }
      .terminal-body {
        padding: 10px;
        font-size: 0.8rem;
      }
      .ascii-art {
        font-size: 0.55rem;
      }
    }

    /* Confetti Canvas Container */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <canvas id="canvas-container"></canvas>

  <div class="terminal-container">
    <div class="terminal-header">
      <div class="buttons">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="title">mit-student@beaver-server:~ (zsh)</div>
      <div></div>
    </div>

    <div class="terminal-body" id="terminal-body">
      <div class="line">[OK] Initializing Birthday Protocol v2026...</div>
      <div class="line">[OK] Connection established with MIT Campus Subnet.</div>
      <div class="line">----------------------------------------------------</div>
      <div class="line">Type <span class="accent">'help'</span> or <span class="accent">'menu'</span> for options.</div>
      <div class="line">----------------------------------------------------</div>

      <!-- Input element appended dynamically via JS -->
      <div class="input-line" id="input-row">
        <span class="prompt-symbol">guest@mit-node:~$</span>
        <input type="text" id="user-input" autofocus autocomplete="off" spellcheck="false" enterkeyhint="go">
      </div>
    </div>
  </div>

  <!-- Lightweight Confetti Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const terminalBody = document.getElementById('terminal-body');
    const inputRow = document.getElementById('input-row');
    const userInput = document.getElementById('user-input');

    const FRIEND_NAME = "Engineer";

  const HELP_TEXT = `Available Commands:
    • <span class="accent">help / menu</span>: Display this menu
    • <span class="accent">cake</span>: Render ASCII Birthday Cake & Banner
    • <span class="accent">wish</span>: Read your birthday message
    • <span class="accent">party</span>: Trigger confetti protocol
    • <span class="accent">stats</span>: View current MIT life metrics
    • <span class="accent">clear</span>: Clear terminal window`;

  const COMMANDS = {
    'help': HELP_TEXT,
    'menu': HELP_TEXT,

      'cake': `                                 (
                    (
            )                    )             (
                    )           (o)    )
            (      (o)    )     ,|,            )
           (o)     ,|,          |~\\    (      (o)
           ,|,     |~\\    (     \\ |   (o)     ,|,
           \\~|     \\ |   (o)    |\`\\   ,|,     |~\\
           |\`\\     |\`\\@@@,|,@@@@\\ |@@@\\~|     \\ |
           \\ | o@@@\\ |@@@\\~|@@@@|\`\\@@@|\`\\@@@o |\`\\
          o|\`\\@@@@@|\`\\@@@|\`\\@@@@\\ |@@@\\ |@@@@@\\ |o
        o@@\\ |@@@@@\\ |@@@\\ |@@@@@@@@@@|\`\\@@@@@|\`\\@@o
       @@@@|\`\\@@@@@@@@@@@|\`\\@@@@@@@@@@\\ |@@@@@\\ |@@@@
       p@@@@@@@@@@@@@@@@@\\ |@@@@@@@@@@|\`\\@@@@@@@@@@@q
       @@o@@@@@@@@@@@@@@@|\`\\@@@@@@@@@@@@@@@@@@@@@@o@@
       @:@@@o@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@o@@::@
       ::@@::@@o@@@@@@@@@@@@@@@@@@@@@@@@@@@@o@@:@@::@
       ::@@::@@@@::oo@@@@oo@@@@@ooo@@@@@:::@@@::::::
       %::::::@::::::@@@@:::@@@:::::@@@@:::::@@:::::%
       %%::::::::::::@@::::::@:::::::@@::::::::::::%%
       ::%%%::::::::::@::::::::::::::@::::::::::%%%::
     .#::%::%%%%%%:::::::::::::::::::::::::%%%%%::%::#.
   .###::::::%%:::%:%%%%%%%%%%%%%%%%%%%%%:%:::%%:::::###.
 .#####::::::%:::::%%::::::%%%%:::::%%::::%::::::::::#####.
.######\`:::::::::::%:::::::%:::::::::%::::%:::::::::'######.
.#########\`\`::::::::::::::::::::::::::::::::::::''#########.
\`.#############\`\`\`::::::::::::::::::::::::'''#############.'
 \`.######################################################.'
   \`.##################################################.'
      \`.#############################################.'
         \`.########################################.'
            \`.##################################.' 


-----------------------------------------------------------


   ,-.
   | |
   | "--.  ,--.-.,-.--. ,-.--. ,-. ,-.
   | ,-. \\/ ,-. || ,-. \\| ,-. \\| | | |
   | | | |\\ \`-' || \`-' /| \`-' /| \`-' |
   \`-' \`-' \`--'-'| .--' | .--'  \`--. |
                 | |    | |        | |
                 \`-'    \`-'        \`-'
,-.     _       ,-.  ,-.        ,-.
| |    (_)      | |_ | |        | |
| "--. ,-.,-.--.|  _)| "--.  ,--" | ,--.-.,-. ,-.
| ,-. \\| || ,-./| |  | ,-. \\/ ,-. |/ ,-. || | | |
| \`-' /| || |   | |  | | | |\\ \`-' |\\ \`-' || \`-' |
"-'--' \`-'\`-'   \`-'  \`-' \`-' \`--'-' \`--'-' \`--. |
                                              | | 
                                              \`-'
                  _                
         /\\      | |               
        /  \\   __| | ___ _ __ ___  
       / /\\ \\ / _' |/ _ \\ '_ ' _ \\ 
      / ____ \\ (_| |  __/ | | | | |
     /_/    \\_\\__,_|\\___|_| |_| |_|
                               
                               
                            
                                                                         
------------------------------------------------`,

      'wish': `Happy Birthday, ${FRIEND_NAME}! 🎉
Hope you survive next year's P-sets and get some actual sleep.
Keep crushing it at MIT! 🚀`,

      'stats': `[ADEM] - [SYSTEM TELEMETRY]
-----------------------------
Department:      Course 6-3 (CS & Engineering)
Class Year:      Class of 2028
Coffee Level:    98%
Sleep Deficit:   344 hrs
Intellect:       Over 9000
Age:             21 [Level Unlocked! 🥂] -obviously joking-
Current Status:  Older & Smarter #surviving`,

      'party': 'CELEBRATION PROTOCOL LAUNCHED! 🥳'
    };

    document.addEventListener('click', () => userInput.focus());

    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const command = this.value.trim().toLowerCase();
        this.value = '';

        if (!command) return;

        createLine(`<span class="prompt-symbol">guest@mit-node:~$</span> ${command}`);

        if (command === 'clear') {
          const lines = terminalBody.querySelectorAll('.line, .ascii-art-wrapper');
          lines.forEach(line => line.remove());
        } else if (command === 'party') {
          createLine(COMMANDS['party']);
          triggerConfetti();
        } else if (command === 'cake') {
          createAsciiArt(COMMANDS['cake']);
          triggerConfetti();
        } else if (COMMANDS[command]) {
          createLine(COMMANDS[command]);
        } else {
          createLine(`command not found: ${command}. Type <span class="accent">'help'</span> for a list of commands.`);
        }

        terminalBody.scrollTop = terminalBody.scrollHeight;
      }
    });

    function createLine(htmlContent) {
      const line = document.createElement('div');
      line.className = 'line';
      line.innerHTML = htmlContent;
      terminalBody.insertBefore(line, inputRow);
    }

    // Auto-scales ASCII art for narrow screen sizes
    function createAsciiArt(artString) {
      const wrapper = document.createElement('div');
      wrapper.className = 'ascii-art-wrapper';
      
      const pre = document.createElement('pre');
      pre.className = 'ascii-art';
      pre.textContent = artString;
      
      wrapper.appendChild(pre);
      terminalBody.insertBefore(wrapper, inputRow);

      requestAnimationFrame(() => {
        const containerWidth = terminalBody.clientWidth - 30;
        const artWidth = pre.scrollWidth;
        if (artWidth > containerWidth) {
          const scale = containerWidth / artWidth;
          pre.style.transform = `scale(${scale})`;
          wrapper.style.height = `${pre.offsetHeight * scale}px`;
        }
      });
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    console.log(
    "%c [MIT COURSE 6-3 DETECTED] %c \n\nHey Adem! I know you're inspecting the source code. 👁️\nStop debugging and go celebrate turning 21! 🍻",
    "background: #39ff14; color: #000; font-size: 16px; font-weight: bold; padding: 4px 8px; border-radius: 4px;",
    "color: #58a6ff; font-size: 14px; font-weight: normal;"
    );
  </script>
</body>
</html>
